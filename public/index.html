    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebApplication",
            "name": "EncryptTool",
            "url": "https://encrypttool.invalid/",
            "applicationCategory": "SecurityApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Works offline once loaded",
            "description": "An advisor that suggests offline, paper-based ways to protect a password, ranked against six choices you make.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "GBP" },
            "isAccessibleForFree": true
          },
          {
            "@type": "FAQPage",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "Does this site ever see my passwords?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "No. There is no input field for a secret anywhere on the site, no analytics, no cookies and no network calls once the page has loaded. It suggests methods; you carry them out on paper."
                }
              },
              {
                "@type": "Question",
                "name": "Why not just let the website generate a password for me?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Because the whole point of an offline secret is that it was never on a computer. A password generated in a browser has been in memory, possibly in a swap file and possibly in a backup. Roll it with dice or deal it from cards instead - the site tells you how many and prints the tables you need."
                }
              },
              {
                "@type": "Question",
                "name": "Are classical ciphers like Vigenere actually secure?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Not against a cryptanalyst. Vigenere, Playfair and transposition ciphers stop a burglar or a houseguest, and they have been breakable by experts since the nineteenth century. Only one-time pads and true secret splitting are unbreakable, and this tool labels every method accordingly."
                }
              }
            ]
          }
        ]
      }
    </script>
  </head>
  <body>
    <a class="skip-link" href="#result">Skip to the result</a>

    <header class="bar">
      <p class="brand"><span class="mark" aria-hidden="true">{ }</span> EncryptTool</p>
      <p class="strap">Protect a password on paper. Nothing you choose here is a secret, and nothing leaves this page.</p>
      <p class="build" id="build-stamp"></p>
    </header>

    <main class="screen">
      <section class="choices" aria-labelledby="choices-title">
        <h1 id="choices-title">Six choices</h1>
        <form id="choices-form" novalidate></form>
      </section>

      <section class="result" id="result" aria-labelledby="result-title">
        <h2 id="result-title" class="visually-hidden">Your methods</h2>
        <div id="result-body"></div>
      </section>
    </main>

    <div id="print-sheet" class="print-sheet" hidden></div>

    <script src="/build-info.js"></script>

    <script src="/recommend.js"></script>
    <script src="/printables.js"></script>
    <script src="/app.js"></script>
  </body>
